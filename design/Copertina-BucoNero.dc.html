<style>
body{margin:0;background:#070A16}
a{color:#EEF1FA}a:hover{color:#FFFFFF}
::selection{background:rgba(255,217,122,0.35)}
a:focus-visible,button:focus-visible{outline:2px solid #EEF1FA;outline-offset:4px}
.ch{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s cubic-bezier(0.16,1,0.3,1) forwards}
.fade{opacity:0;animation:fadein 0.9s ease-out forwards}
.rise{animation:rise 1.4s cubic-bezier(0.16,1,0.3,1) both}
.slam{animation:slam 0.9s cubic-bezier(0.16,1,0.3,1) both}
.flow{animation:flow 18s linear infinite}
.lvl{transition:opacity 0.8s ease}
.stopc{transition:stop-color 0.7s ease}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:scale(0.6) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes slam{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-560}}
.cls{transition:background-color 0.25s ease,color 0.25s ease,border-color 0.25s ease,transform 0.25s cubic-bezier(0.34,1.4,0.64,1)}
.cls:active{transform:scale(0.94)}
.acc{transition:color 0.5s ease,background-color 0.5s ease,border-color 0.5s ease}
@media (prefers-reduced-motion: reduce){.ch{animation:none;stroke-dashoffset:0}.fade{animation:none;opacity:1}.rise,.slam,.flow{animation:none}.lvl,.stopc,.cls,.acc{transition:none}}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { energy: 3 };
  }
  renderVals() {
    const e = this.state.energy;
    const states = [
      null,
      { name: "Sgr A*", word: "a riposo", color: "#E2604A", disk: 0.32, glow: 0.22, ring: 0.45, jet: 0 },
      { name: "LINER", word: "fiacco", color: "#FF9757", disk: 0.55, glow: 0.34, ring: 0.6, jet: 0 },
      { name: "Seyfert", word: "regolare", color: "#FFCF6E", disk: 0.82, glow: 0.48, ring: 0.8, jet: 0 },
      { name: "Quasar", word: "carico", color: "#EAF0FF", disk: 1, glow: 0.66, ring: 0.95, jet: 0.35 },
      { name: "Blazar", word: "al massimo", color: "#8DB2FF", disk: 1, glow: 0.85, ring: 1, jet: 1 }
    ];
    const s = states[e];
    const levels = [1, 2, 3, 4, 5].map((n) => {
      const t = states[n];
      const on = n === e;
      return {
        name: t.name,
        word: t.word,
        checked: on ? "true" : "false",
        aria: t.name + ", " + t.word,
        border: on ? t.color : "rgba(185,199,238,0.22)",
        bg: on ? t.color : "rgba(7,10,22,0.55)",
        fg: on ? "#070A16" : "#EEF1FA",
        glyph: on ? "#070A16" : t.color,
        glyphW: String(1 + n * 0.5),
        pick: () => this.setState({ energy: n })
      };
    });
    const tiers = {
      low: {
        h1: "Una giornata", h2: "per ricaricarsi",
        rule: "Disco quasi spento: niente teoria nuova, blocchi da 45 minuti e tanto ripasso attivo.",
        plan: [
          { n: "1", dur: "45 min", title: "Ripasso attivo di Struttura", detail: "Spiega a voce le regole di selezione." },
          { n: "2", dur: "30 min", title: "Ripasso a 10 dita", detail: "Le schede scadute di Astrofisica Stellare." },
          { n: "3", dur: "30 min", title: "Camminata", detail: "Recupero attivo, la corsa aspetta." },
          { n: "4", dur: "30 min", title: "Lettura", detail: "Un capitolo, senza telefono." }
        ]
      },
      mid: {
        h1: "Una giornata", h2: "da esercizi",
        rule: "Accrescimento regolare: l'esame più vicino va per primo, in blocchi da 90 minuti.",
        plan: [
          { n: "1", dur: "2 × 90 min", title: "Scritto di Struttura della Materia", detail: "Due esercizi d'esame dagli appelli passati." },
          { n: "2", dur: "60 min", title: "Fortran per Calcolo", detail: "Un esercizio completo fino all'output." },
          { n: "3", dur: "20 min", title: "Ripasso a 10 dita", detail: "Escissione e Mayer-Vietoris." },
          { n: "4", dur: "18:30", title: "Arrampicata", detail: "La seconda delle tre di questa settimana." }
        ]
      },
      high: {
        h1: "Una giornata", h2: "da teoria nuova",
        rule: "Regime da quasar: la teoria più difficile nelle prime ore, quando la testa regge.",
        plan: [
          { n: "1", dur: "2 × 90 min", title: "Dualità di Poincaré", detail: "Ricostruisci la dimostrazione senza appunti." },
          { n: "2", dur: "90 min", title: "Scritto di Struttura della Materia", detail: "17 giorni all'esame." },
          { n: "3", dur: "45 min", title: "Lean 4", detail: "Esercizi del capitolo in corso." },
          { n: "4", dur: "40 min", title: "Corsa", detail: "Nessuna corsa ancora questa settimana." }
        ]
      }
    };
    const t = e <= 2 ? tiers.low : (e === 3 ? tiers.mid : tiers.high);
    return {
      levels: levels,
      accent: s.color,
      diskOp: String(s.disk),
      glowOp: String(s.glow),
      ringOp: String(s.ring),
      jetOp: String(s.jet),
      headline1: t.h1,
      headline2: t.h2,
      tierRule: t.rule,
      plan: t.plan
    };
  }
}
</script>
